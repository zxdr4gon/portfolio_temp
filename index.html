<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your Name — Portfolio</title>
  <meta name="description" content="A personal portfolio of projects and experiments." />
  <meta name="theme-color" content="#11110f" />
  <meta name="color-scheme" content="light dark" />

  <!-- Installable web app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Portfolio" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Link previews (Discord, iMessage, LinkedIn, etc.). Crawlers don't run JavaScript, so set these by hand.
       og:url and og:image must be full URLs, e.g. https://YOUR-USERNAME.github.io/YOUR-REPO/ -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Your Name — Portfolio" />
  <meta property="og:description" content="A personal portfolio of projects and experiments." />
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/YOUR-REPO/" />
  <meta property="og:image" content="https://YOUR-USERNAME.github.io/YOUR-REPO/icons/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Edit config.js to personalize the content and theme. These two load first so the right colors paint immediately. -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.6 4.6 6 6M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
    </defs>
  </svg>

  <a href="#main-content" class="skip-link focus-ring">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress"></span></div>

  <header class="site-header" id="site-header">
    <nav class="container nav" aria-label="Main navigation">
      <a id="brand-link" href="#home" class="brand focus-ring" aria-label="Home">
        <span id="brand-mark" class="brand-mark">Y.</span>
        <span id="brand-name">Your Name</span>
      </a>
      <div class="nav-links">
        <a href="#projects" class="nav-link focus-ring" data-section="projects">Work</a>
        <a href="#about" class="nav-link focus-ring" data-section="about">About</a>
        <div id="nav-socials" class="nav-socials"></div>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-button focus-ring" type="button" aria-label="Switch color theme" hidden>
          <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
        <a id="header-contact" href="#contact" class="pill-link focus-ring">
          Contact <svg class="icon icon-sm" aria-hidden="true"><use href="#i-arrow"/></svg>
        </a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <section id="home" class="hero" data-section-anchor>
      <div aria-hidden="true" class="hero-grid"></div>
      <div class="container hero-inner">
        <div class="eyebrow-row" data-reveal>
          <span class="dot" aria-hidden="true"></span>
          <p id="eyebrow" class="eyebrow"></p>
        </div>
        <h1 id="hero-title" class="hero-title" data-reveal></h1>
        <div class="hero-bottom" data-reveal>
          <p id="bio" class="hero-bio"></p>
          <a href="#projects" class="button focus-ring">
            <span id="hero-button-text">Explore my work</span><svg class="icon icon-sm icon-down" aria-hidden="true"><use href="#i-arrow"/></svg>
          </a>
        </div>
        <div class="hero-meta" data-reveal>
          <p class="eyebrow eyebrow-xs">Selected work</p>
          <p id="gallery-subtitle" class="hero-meta-text"></p>
        </div>
      </div>
    </section>

    <section id="projects" class="container section-projects" aria-labelledby="projects-title" data-section-anchor>
      <div class="section-head" data-reveal>
        <div>
          <p id="projects-kicker" class="kicker"></p>
          <h2 id="projects-title" class="section-title"></h2>
        </div>
        <p id="projects-intro" class="section-intro"></p>
      </div>
      <div id="project-filters" class="filters" role="toolbar" aria-label="Filter projects by technology" hidden></div>
      <p id="filter-status" class="sr-only" aria-live="polite"></p>
      <div id="project-grid" class="project-grid">
        <!-- Cards are rendered from config.js. -->
      </div>
      <p id="no-projects" class="empty-note" hidden>Your projects will appear here. Add them to the projects array in config.js.</p>
    </section>

    <section id="about" class="section-about" aria-labelledby="about-title" data-section-anchor>
      <div class="container about-inner" data-reveal>
        <div>
          <p id="about-kicker" class="kicker"></p>
          <h2 id="about-title" class="section-title"></h2>
        </div>
        <div class="about-body">
          <p id="about-copy" class="about-copy"></p>
          <div id="about-links" class="about-links"></div>
        </div>
      </div>
    </section>

    <section id="contact" class="container section-contact" aria-labelledby="contact-title" data-section-anchor>
      <div class="contact-card" data-reveal>
        <div aria-hidden="true" class="ring ring-lg"></div>
        <div aria-hidden="true" class="ring ring-sm"></div>
        <p id="contact-kicker" class="kicker"></p>
        <h2 id="contact-title" class="contact-title"></h2>
        <p id="contact-copy" class="contact-copy"></p>
        <div class="contact-actions">
          <a id="contact-button" href="#contact" class="button focus-ring">
            <span id="contact-button-text">Say hello</span><svg class="icon icon-sm" aria-hidden="true"><use href="#i-arrow"/></svg>
          </a>
          <button id="copy-email" class="ghost-button focus-ring" type="button" hidden>
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-copy"/></svg><span>Copy email</span>
          </button>
          <button id="share-button" class="ghost-button focus-ring" type="button">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-share"/></svg><span>Share</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-meta">
        <p id="copyright" class="footer-note"></p>
        <div id="install-wrap" class="footer-install" hidden>
          <button id="install-button" class="footer-link focus-ring" type="button">Install app</button>
          <p id="install-hint" class="footer-note" hidden></p>
        </div>
      </div>
      <div id="footer-socials" class="footer-socials"></div>
    </div>
  </footer>

  <button id="back-to-top" class="icon-button back-to-top focus-ring" type="button" aria-label="Back to top">
    <svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>
  </button>

  <!-- Phone navigation: app-style tab bar -->
  <nav class="tab-bar" aria-label="Sections">
    <a href="#home" class="tab focus-ring" data-section="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#projects" class="tab focus-ring" data-section="projects"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>Work</span></a>
    <a href="#about" class="tab focus-ring" data-section="about"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>About</span></a>
    <a href="#contact" class="tab focus-ring" data-section="contact"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg><span>Contact</span></a>
  </nav>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
